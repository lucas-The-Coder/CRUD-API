<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }
        #product-list {
            margin-top: 20px;
        }
        .product {
            border: 1px solid #ccc;
            padding: 10px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <h1>Product List</h1>
    <form id="add-product-form">
        <label for="product-name">Product Name:</label>
        <input type="text" id="product-name" name="name"><br><br>
        <label for="product-quantity">Quantity:</label>
        <input type="number" id="product-quantity" name="quantity"><br><br>
        <button type="submit">Add Product</button>
    </form>
    <div id="product-list"></div>

    <script>
        const form = document.getElementById('add-product-form');
        const productList = document.getElementById('product-list');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const productName = document.getElementById('product-name').value;
            const productQuantity = document.getElementById('product-quantity').value;

            const response = await fetch('/api/products', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: productName, quantity: productQuantity }),
            });

            const data = await response.json();
            console.log(data);

            // Display the updated product list
            productList.innerHTML = '';
            data.products.forEach((product) => {
                const productHTML = `
                    <div class="product">
                        <h2>${product.name}</h2>
                        <p>Quantity: ${product.quantity}</p>
                    </div>
                `;
                productList.innerHTML += productHTML;
            });
        });

        // Load the product list on page load
        fetch('/api/products')
            .then((response) => response.json())
            .then((data) => {
                const products = data.products;
                products.forEach((product) => {
                    const productHTML = `
                        <div class="product">
                            <h2>${product.name}</h2>
                            <p>Quantity: ${product.quantity}</p>
                        </div>
                    `;
                    productList.innerHTML += productHTML;
                });
            })
            .catch((error) => console.error(error));
    </script>
</body>
</html>
